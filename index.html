function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(window._toast);window._toast=setTimeout(()=>e.style.display="none",2300)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function levelNeed(l){return Math.round(100*Math.pow(1.22,l-1))}
function totalOutputBonus(){return Object.values(state.equipped).reduce((a,id)=>{const x=state.inventory.find(i=>i.id===id);return a+(x?.effect==="allDamage"?x.value:0)},0)}
function statDamageBonus(stat){return Object.values(state.equipped).reduce((a,id)=>{const x=state.inventory.find(i=>i.id===id);return a+(x?.effect==="statDamage"&&x.stat===stat?x.value:0)},0)}
function statOutput(stat){let b=1+(state.stats[stat]||0)/200;if(state.class)b*=1+(classes[state.class].bonuses[stat]||0);return b}
function taskDamage(t){return Object.entries(t.stats||{}).reduce((total,[stat,points])=>total+points*statOutput(stat)*(1+totalOutputBonus())*(1+statDamageBonus(stat)),0)}
function bossDamage(t,b){return Object.entries(t.stats||{}).reduce((total,[stat,points])=>{let mult=1;if(stat===b.weak)mult=1.5;if((b.resist||[]).includes(stat))mult=0.5;return total+points*statOutput(stat)*(1+totalOutputBonus())*(1+statDamageBonus(stat))*mult},0)}
function localDateKey(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`}
function todayKey(){return localDateKey()}
function weekKey(){const d=new Date(),day=d.getDay()||7,monday=new Date(d);monday.setHours(0,0,0,0);monday.setDate(d.getDate()-day+1);return localDateKey(monday)}
function taskId(t){if(!t.id)t.id="task-"+Math.random().toString(36).slice(2,10);return t.id}
function taskDays(t){if(Array.isArray(t.days)&&t.days.length)return t.days.map(Number);return [1,2,3,4,5,6,0]}
function taskAvailability(t){const day=new Date().getDay();if(t.type==="Daily")return {available:true,label:"Every day"};if(t.type==="Weekly"&&Array.isArray(t.days)&&t.days.length){return {available:t.days.includes(day),label:t.days.map(d=>DAYS[d].slice(0,3)).join(" + ")}}if(t.type==="Weekly")return {available:true,label:"Once per week"};return {available:true,label:t.type}}
function completionKey(t){taskId(t);if(t.type==="Daily")return t.id+"|day|"+todayKey();if(t.type==="Weekly"&&Array.isArray(t.days)&&t.days.length)return t.id+"|day|"+todayKey();if(t.type==="Weekly")return t.id+"|week|"+weekKey();return t.id+"|once"}
function isTaskDone(t){return !!state.completed[completionKey(t)]}
function canCompleteTask(t){if(isTaskDone(t))return false;const a=taskAvailability(t);return a.available}
function levelCheck(){let gained=[];while(state.xp>=levelNeed(state.level)){state.xp-=levelNeed(state.level);state.level++;gained.push(state.level)}for(const l of gained)if(!state.pendingChests.includes(l)&&!state.chestLevels.includes(l))state.pendingChests.push(l);return gained}
function openChest(l){if(state.chestLevels.includes(l))return toast("This chest has already been opened.");const pool=items.filter(x=>x.rarity!=="Legendary"||state.level>=20);const item=pool[Math.floor(Math.random()*pool.length)],copy={...item,id:item.id+"-"+Date.now()+"-"+Math.random().toString(16).slice(2)};state.inventory.push(copy);state.chestLevels.push(l);state.pendingChests=state.pendingChests.filter(x=>x!==l);state.log.unshift(`Level ${l} chest opened: ${item.name}`);save();render();showEventModal("chest",{level:l,item:copy})}
function showEventModal(type,data){const m=document.getElementById("modal"),c=document.getElementById("modalContent");let html="";if(type==="complete")html=`<div class="modal-event"><div class="event-icon">⚔️</div><div class="event-title">Activity Complete!</div><div class="event-sub">${esc(data.name)}</div><div class="reward-grid"><div class="reward-box"><span class="muted small">XP</span><b class="xp">+${data.xp}</b></div><div class="reward-box"><span class="muted small">Gold</span><b class="gold">+${data.gold}</b></div><div class="reward-box"><span class="muted small">Damage</span><b>${data.damage}</b></div></div></div>${data.damage===0?`<div class="muted small" style="margin-top:8px">No combat damage: this activity awards no stat points.</div>`:""}${data.statsHtml?`<div class="loot">${data.statsHtml}</div>`:""}<button class="primary" onclick='continueAfterReward(${JSON.stringify(data.levels||[])},${JSON.stringify(data.defeatedObj||null)},${JSON.stringify(data.bossResult||null)})'>Continue</button></div>`;else if(type==="level")html=`<div class="modal-event"><div class="event-icon">🎉</div><div class="event-title">LEVEL UP!</div><div class="event-sub">You reached Level ${data.level}</div><div class="loot">🔓 New content unlocked as you grow stronger.</div><button class="primary" onclick="openChest(${data.level})">🎁 Open Level ${data.level} Chest</button></div>`;else if(type==="chest")html=`<div class="modal-event"><div class="event-icon">🎁</div><div class="event-title">Loot Acquired!</div><div class="event-sub">Level ${data.level} chest opened</div><div class="loot"><div style="font-size:22px;font-weight:800">${esc(data.item.name)}</div><span class="tag">${esc(data.item.rarity)}</span><p class="muted">${esc(data.item.desc)}</p></div><button class="primary" onclick="continueAfterChest()">Continue</button></div>`;else if(type==="boss")html=data.hp===undefined?`<div class="modal-event"><div class="event-icon">👑</div><div class="event-title">Boss Defeated!</div><div class="event-sub">${esc(data.name)}</div><div class="loot">Victory! +${data.gold} bonus gold</div><button class="primary" onclick="closeModal();render()">Continue</button></div>`:"";else if(type==="monster")html=`<div class="modal-event"><div class="event-icon">💥</div><div class="event-title">Enemy Defeated!</div><div class="event-sub">${esc(data.name)}</div><div class="loot complete-badge">Victory! +${data.gold} bonus gold</div>${data.loot?`<div class="loot"><b>🎁 Monster Loot</b><div style="font-size:20px;font-weight:800">${esc(data.loot.name)}</div><span class="tag">${esc(data.loot.rarity)}</span><p class="muted">${esc(data.loot.desc)}</p></div>`:""}<button class="primary" onclick='continueAfterMonster(${JSON.stringify(data.levels||[])})'>Continue</button></div>`;c.innerHTML=html;m.style.display="flex"}
function continueAfterReward(levels,defeated,bossResult){if(levels?.length)return showEventModal("level",{level:levels[0]});if(defeated&&defeated.killed)return showEventModal("monster",{name:defeated.name,gold:defeated.gold,loot:defeated.loot||null,levels:[]});if(bossResult&&bossResult.name&&bossResult.hp===undefined)return showEventModal("boss",bossResult);closeModal();render()}

function completeTask(i){const t=state.tasks[i];if(!t)return;if(!canCompleteTask(t)){const a=taskAvailability(t);return toast(a.available?"Already completed for this period.":"Not scheduled for today.")}const xp=t.xp;state.xp+=xp;for(const [s,v] of Object.entries(t.stats||{}))state.stats[s]=(state.stats[s]||0)+v;const gold=Math.max(1,Math.floor(xp/3));state.gold+=gold;state.completed[completionKey(t)]=true;state.totalCompletions++;const damage=Math.round(taskDamage(t));const defeated=damageDungeon(damage);let bossResult=null;if(state.activeBossId){const active=bossList.find(b=>b.id===state.activeBossId);if(active&&state.level>=active.need)bossResult=applyBossTaskDamage(t,active)}const levels=levelCheck();checkAchievements();const statsHtml=Object.entries(t.stats||{}).map(([s,v])=>`${ICONS[s]} +${v} ${s}`).join(" &nbsp; ");state.log.unshift(`${t.name}: +${xp} XP, +${damage} damage`);save();render();showEventModal("complete",{name:t.name,xp,gold,damage,levels,statsHtml,defeatedObj:(defeated&&defeated.killed?defeated:null),bossResult:(bossResult&&bossResult.hp===undefined?bossResult:null)})}
const DUNGEON_STATE_VERSION=2;
function ensureDungeonState(){const d=state.dungeon;if(!d)return;const max=enemyMax(d);if(!Number.isFinite(d.enemyHp)||d.enemyHp<=0||d.enemyHp===105)d.enemyHp=max;else d.enemyHp=Math.min(d.enemyHp,max);if(!Number.isFinite(d.damageThisEnemy)||d.damageThisEnemy<0)d.damageThisEnemy=0;d.version=DUNGEON_STATE_VERSION}
function damageDungeon(dmg){
 const d=state.dungeon;ensureDungeonState();
 dmg=Math.max(0,Math.round(Number(dmg)||0));
 const before=d.enemyHp,max=enemyMax(d);
 d.enemyHp=Math.max(0,before-dmg);
 const dealt=before-d.enemyHp;
 d.damageThisEnemy=(d.damageThisEnemy||0)+dealt;
 if(d.enemyHp<=0){
   const names=["Forest Slime","Goblin Raider","Wandering Wraith","Elite Warden","Habit Beast","Shadow Hound"];
   const name=names[d.enemyIndex%names.length];
   const wasElite=d.enemyIndex===3;
   const bonus=10+d.floor*2+(wasElite?10:0);
   state.gold+=bonus;state.totalKills++;
   let loot=null;
   const chance=wasElite?.45:.12;
   if(Math.random()<chance){
     const pool=monsterLootItems.filter(x=>!x.minLevel||state.level>=x.minLevel);
     if(pool.length){
       const drop=pool[Math.floor(Math.random()*pool.length)];
       loot={...drop,id:drop.id+"-monster-"+Date.now()+"-"+Math.random().toString(16).slice(2)};
       state.inventory.push(loot);
       state.log.unshift(`${name} dropped ${drop.name}!`);
     }
   }
   d.enemyIndex++;
   const dung=dungeons.find(x=>x.id===d.id)||dungeons[0];
   if(d.enemyIndex>=4){
     d.enemyIndex=0;d.floor++;
     if(d.floor>dung.floors){d.floor=1;toast(`🏆 ${dung.name} cleared!`)}
   }
   d.enemyHp=enemyMax(d);d.damageThisEnemy=0;
   state.log.unshift(`Defeated ${name}!`);
   checkAchievements();
   return {name,gold:bonus,dealt,killed:true,remaining:0,maxHp:max,loot};
 }

function createTaskFromModal(){const name=document.getElementById("tn").value.trim();if(!name)return;const diff=document.getElementById("td").value,stats={};STATS.forEach(s=>{const v=+document.getElementById("sg_"+s).value||0;if(v)stats[s]=v});const days=DAYS.map((_,i)=>document.getElementById("day_"+i).checked?i:null).filter(x=>x!==null);addTask({name,type:document.getElementById("tt").value,difficulty:diff,xp:+document.getElementById("tx").value||diffBase[diff],stats,primary:document.getElementById("ts").value,days,desc:document.getElementById("tdesc").value})}
function editTask(i){taskModal(i)}
function saveTaskEdit(i){const t=state.tasks[i],stats={};STATS.forEach(s=>{const v=+document.getElementById("sg_"+s).value||0;if(v)stats[s]=v});t.name=document.getElementById("tn").value.trim()||t.name;t.type=document.getElementById("tt").value;t.difficulty=document.getElementById("td").value;t.xp=Math.max(1,+document.getElementById("tx").value||1);t.stats=stats;t.primary=document.getElementById("ts").value;t.days=DAYS.map((_,i)=>document.getElementById("day_"+i).checked?i:null).filter(x=>x!==null);t.desc=document.getElementById("tdesc").value;save();closeModal();render();toast("Task updated.")}
function deleteTask(i){if(confirm("Delete this task?")){state.tasks.splice(i,1);save();closeModal();render()}}
function closeModal(){document.getElementById("modal").style.display="none"}
function chooseClass(c){if(state.class)return toast("Class already chosen.");state.class=c;save();render();toast("Class chosen: "+c)}
function checkAchievements(){for(const a of achievementDefs){if(!state.achievements.includes(a.id)&&a.check()){state.achievements.push(a.id);state.gold+=a.reward;state.log.unshift(`Achievement unlocked: ${a.name} (+${a.reward} gold)`);toast(`🏆 Achievement unlocked: ${a.name}!`)}}save()}
function resetData(){if(confirm("This resets your character, progress, inventory, gold, achievements and boss progress, but keeps your current task list. Continue?")){const keptTasks=structuredClone(state.tasks);localStorage.removeItem("lifeRPG_v1");bossList.forEach(b=>localStorage.removeItem("boss_"+b.id));state=defaultState();state.tasks=keptTasks;state.activeBossId=null;state.tasks.forEach(taskId);save();location.reload()}}
function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="life-rpg-save.json";a.click();URL.revokeObjectURL(a.href)}
function importSave(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);state.pendingChests??=[];state.chestLevels??=[];state.completed??={};state.achievements??=[];state.cosmetics??=[];state.equippedCosmetics??={};state.totalCompletions??=0;state.totalKills??=0;state.bossKills??=0;save();render();toast("Save imported.")}catch{toast("Invalid save file.")}};r.readAsText(f)}
function home(){const need=levelNeed(state.level),pct=Math.min(100,state.xp/need*100),d=state.dungeon,du=dungeons.find(x=>x.id===d.id)||dungeons[0];document.getElementById("app").innerHTML=`<div class="grid"><section class="panel wide"><div class="hero"><div><div class="level">Level ${state.level} ${state.class?"• "+esc(state.class):""}</div><div class="muted">${esc(state.name)} ${state.activeCosmetic?"• ✨ "+esc(cosmetics.find(c=>c.id===state.activeCosmetic)?.name||""):""}</div></div><div class="gold">🪙 ${state.gold}</div></div><div style="margin:10px 0 5px">XP ${state.xp} / ${need}</div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="stats">${STATS.map(s=>`<div class="stat">${ICONS[s]} ${s}<b>${state.stats[s]}</b><span class="muted small">Output ×${statOutput(s).toFixed(2)}</span></div>`).join("")}</div></section><section class="panel"><h2>⚔️ Active Expedition</h2><div class="enemy">${du.theme} ${du.name}</div><p>Floor ${d.floor} • Enemy ${d.enemyIndex+1}/4</p><div class="bar"><div class="fill" style="width:${Math.max(0,d.enemyHp/enemyMax(d)*100)}%"></div></div><p class="muted small">Complete real-life tasks to deal damage.</p><button class="primary" onclick="page='tasks';render()">View tasks</button></section><section class="panel"><h2>📊 Progress</h2><div>Activities completed: <b>${state.totalCompletions}</b></div><div>Enemies defeated: <b>${state.totalKills}</b></div><div>Bosses defeated: <b>${state.bossKills}</b></div><div>Equipment owned: <b>${state.inventory.length}</b></div></section><section class="panel"><h2>🔓 Next milestones</h2>${[[3,"Ruins of Apathy"],[5,"Warden boss"],[7,"Sunken Archives"],[10,"Glutton boss"],[12,"Crimson Castle"],[15,"Mirror boss"],[18,"Abyssal Rift"],[20,"Grand Procrastinator"],[25,"Dreaming City + Dragon"]].map(([l,x])=>`<div class="${state.level<l?"locked":""}">Level ${l}: ${x} ${state.level>=l?"✓":"🔒"}</div>`).join("")}</section></div>`}
function tasks(){const active=state.tasks.filter(t=>!isTaskDone(t)&&canCompleteTask(t));const unavailable=state.tasks.filter(t=>!isTaskDone(t)&&!canCompleteTask(t));const done=state.tasks.filter(t=>isTaskDone(t));const taskHtml=(t,i,completed=false,unavailable=false)=>{const a=taskAvailability(t);return `<div class="task ${completed?"done":""} ${unavailable?"locked":""}"><div><div class="task-title">${esc(t.name)} ${completed?'<span class="complete-badge">✓ Done</span>':unavailable?`<span class="tag">${esc(a.label)}</span>`:""}</div><span class="tag">${t.type}</span><span class="tag">${t.difficulty}</span><span class="xp">+${t.xp} XP</span><div class="muted small">${esc(t.desc||"")} ${Object.entries(t.stats||{}).map(([s,v])=>`• ${ICONS[s]} +${v} ${s}`).join(" ")}</div></div><div class="row">${completed?'<button disabled>✓ Completed</button>':unavailable?'<button disabled>Not today</button>':`<button class="primary" onclick="completeTask(${i})">✓ Complete</button>`}<button onclick="editTask(${i})">Edit</button></div></div>`};document.getElementById("app").innerHTML=`<div class="grid"><section class="panel wide"><div class="row"><div><h2 style="margin:0">📜 Activities</h2><div class="muted small">${new Date().toLocaleDateString()} • Daily resets tomorrow • Weekly schedules follow selected weekdays</div></div><button class="primary right" onclick="taskModal()">+ Create</button></div>${active.map(t=>taskHtml(t,state.tasks.indexOf(t))).join("")||'<div class="empty">🎉 Nothing left to complete today!</div>'}${unavailable.length?`<h3 style="margin-top:20px">Upcoming / not scheduled today</h3>${unavailable.map(t=>taskHtml(t,state.tasks.indexOf(t),false,true)).join("")}`:""}${done.length?`<h3 style="margin-top:20px">Completed</h3>${done.map(t=>taskHtml(t,state.tasks.indexOf(t),true)).join("")}`:""}</section></div>`}
function dungeon(){ensureDungeonState();const d=state.dungeon,du=dungeons.find(x=>x.id===d.id)||dungeons[0],hp=enemyMax(d);document.getElementById("app").innerHTML=`<div class="grid"><section class="panel wide"><h2>🏰 Dungeons</h2><div class="cols">${dungeons.map(x=>`<div class="panel ${state.level<x.need?"locked":""}"><div class="enemy">${x.theme} ${x.name}</div><div class="muted small">Level ${x.need} • ${x.floors} floors</div><p class="muted small">${x.desc}</p>${state.level>=x.need?`<button class="${x.id===d.id?"primary":""}" onclick="selectDungeon('${x.id}')">${x.id===d.id?"Active":"Enter"}</button>`:"🔒 Locked"}</div>`).join("")}</div></section><section class="panel wide"><h2>${du.theme} ${du.name} • Floor ${d.floor}</h2><p>Encounter ${d.enemyIndex+1}/4</p><div class="panel"><div class="enemy">${d.enemyIndex===3?"Elite Warden":["Forest Slime","Goblin Raider","Wandering Wraith"][d.enemyIndex%3]}</div><div class="bar" style="margin:8px 0"><div class="fill" style="width:${Math.max(0,d.enemyHp/hp*100)}%"></div></div><div>${Math.max(0,d.enemyHp)} / ${hp} HP</div><div class="muted small" style="margin-top:6px">Damage dealt to this enemy: ${d.damageThisEnemy||0}</div></div><p class="muted">Your real-life activities are your attacks.</p><button class="primary" onclick="page='tasks';render()">Complete an activity → attack</button></section></div>`}
function bosses(){document.getElementById("app").innerHTML=`<div class="grid"><section class="panel wide"><h2>👑 Bosses</h2><p class="muted">Complete real-life activities to damage your active boss. Each stat contributes separately. Weaknesses deal 50% extra damage; resistances deal 50% damage.</p>${bossList.map(b=>{const unlocked=state.level>=b.need,hp=Number(localStorage.getItem("boss_"+b.id)||b.hp),pct=hp/b.hp*100,active=state.activeBossId===b.id;return `<div class="panel ${unlocked?"boss":"locked"}" style="margin:10px 0"><div class="row"><div><div class="enemy">${b.name}</div><div class="muted small">Level ${b.need} • Weakness: ${ICONS[b.weak]} ${b.weak} • Resistant: ${(b.resist||[]).map(x=>ICONS[x]+" "+x).join(", ")||"None"}</div><div class="muted small">${b.desc}</div></div><div class="right">${unlocked?(active?`<span class="complete-badge">🎯 Active target</span>`:`<button class="primary" onclick="setActiveBoss('${b.id}')">Target Boss</button>`):"🔒 Locked"}</div></div><div class="bar" style="margin-top:9px"><div class="fill" style="width:${pct}%"></div></div><div class="small">${hp} / ${b.hp} HP</div><div class="muted small">Unique loot: ${items.find(x=>x.id===b.loot)?.name||"Unique item"}</div></div>`}).join("")}</section></div>`}
function setActiveBoss(id){const b=bossList.find(x=>x.id===id);if(!b||state.level<b.need)return;state.activeBossId=id;save();render();toast(`${b.name} is now your target.`)}
function inventory(){const eq=state.inventory;document.getElementById("app").innerHTML=`<div class="grid"><section class="panel wide"><h2>🎒 Equipment</h2><p class="muted small">Equipment affects combat output only. It never gives XP or personal stat gains.</p>${eq.length?eq.map(x=>`<div class="item"><div><b>${esc(x.name)}</b> <span class="tag">${x.rarity}</span><div class="muted small">${esc(x.desc)}</div></div><div class="row"><button onclick="equip('${x.id}')">${state.equipped[x.slot]===x.id?"Unequip":"Equip"}</button><button onclick="sellItem('${x.id}')">Sell ${Math.max(1,Math.floor((x.price||50)*.5))}🪙</button></div></div>`).join(""):"<div class=empty>No equipment yet.</div>"}</section><section class="panel"><h2>⚙️ Equipped output</h2><p>Overall damage bonus: <b>+${Math.round(totalOutputBonus()*100)}%</b></p>${Object.entries(state.equipped).map(([slot,id])=>`<div>${slot}: ${id?esc(state.inventory.find(x=>x.id===id)?.name||"None"):"None"}</div>`).join("")}</section></div>`}
function shop(){document.getElementById("app").innerHTML=`<div class="grid"><section class="panel wide"><div class="row"><div><h2 style="margin:0">🛒 Shop</h2><div class="muted small">Spend gold earned from real-life progress.</div></div><div class="gold right">🪙 ${state.gold}</div></div><h3>Equipment</h3>${items.map(x=>`<div class="item"><div><b>${x.name}</b> <span class="tag">${x.rarity}</span><div class="muted small">${x.desc}</div></div><button class="primary" onclick="buyItem('${x.id}')">${x.price} 🪙</button></div>`).join("")}<h3 style="margin-top:22px">✨ Cosmetics</h3>${cosmetics.map(x=>{const owned=state.cosmetics.includes(x.id);return `<div class="item"><div><b>${x.name}</b> <span class="tag">${x.type}</span><div class="muted small">${x.desc}</div></div>${owned?`<button onclick="useCosmetic('${x.id}')">${state.activeCosmetic===x.id?"Equipped":"Equip"}</button>`:`<button class="primary" onclick="buyCosmetic('${x.id}')">${x.price} 🪙</button>`}</div>`}).join("")}</section></div>`}
function spriteClass(){return state.class?"class-"+state.class.toLowerCase():"class-warrior"}
function baseItemId(id){return String(id||'').split(/-(?:shop|boss)-/)[0]}

function spriteHtml(){
 const classKey={Warrior:'warrior',Ranger:'ranger',Mage:'mage',Rogue:'rogue',Paladin:'paladin',Bard:'bard'}[state.class]||'warrior';
 const eqId=id=>id||'';
 const itemDefById=id=>{const base=String(id||'').split(/-(?:shop|boss|monster)-/)[0];return items.find(x=>x.id===base)||monsterLootItems.find(x=>x.id===base)||null};
 const weaponId=state.equipped?.Weapon; const weapon=weaponId?itemDefById(weaponId):null;
 const trinketId=state.equipped?.Trinket; const trinket=trinketId?itemDefById(trinketId):null;
 const avatar=state.equippedCosmetics?.avatar||'';
 const aura=state.equippedCosmetics?.aura||'';
 const title=state.equippedCosmetics?.title||'';
 const asset=n=>SPRITE_ASSETS[n]||'';
 const img=(n,z,cls='')=>asset(n)?`<img class="full-sprite-layer ${cls}" style="z-index:${z}" src="${asset(n)}" alt="">`:'';
 const weaponAsset=weapon?weapon.id:'';
 const trinketAsset=trinket?trinket.id:'';
 const titleName=title?(cosmetics.find(c=>c.id===title)?.name||''):'';
 return `<div class="asset-card"><div class="asset-stage">
   ${img('aura-spark',1,aura==='aura-spark'?'visible':'hidden')}
   ${img('base-'+classKey,2,'visible')}
   ${img(weaponAsset,4,weaponAsset?'visible':'hidden')}
   ${img(trinketAsset,5,trinketAsset?'visible':'hidden')}
   ${img(avatar,6,avatar?'visible':'hidden')}
 </div><div class="sprite-legend"><h3>🧙 ${esc(state.name)}</h3><div class="muted small" style="margin-bottom:8px">Level ${state.level}${titleName?` • ${esc(titleName)}`:''}</div><div class="layer-list">
 <div class="layer-row"><span>Class</span><span>${esc(state.class||'None')}</span></div>
 <div class="layer-row"><span>Weapon</span><span>${esc(weapon?.name||'None')}</span></div>
 <div class="layer-row"><span>Trinket</span><span>${esc(trinket?.name||'None')}</span></div>
 <div class="layer-row"><span>Head cosmetic</span><span>${avatar==='avatar-crown'?'👑 Golden Crown':avatar==='avatar-helm'?"🪖 Knight's Helm":'None'}</span></div>
 <div class="layer-row"><span>Aura</span><span>${aura==='aura-spark'?'✨ Spark Aura':'None'}</span></div>
 </div></div></div>`;
}
function character(){
 const classHtml=Object.entries(classes).map(([c,x])=>{
   const action=state.class===c?'✓':(!state.class?`<button onclick="chooseClass('${c}')">Choose</button>`:'');
   return `<div class="item"><div><b>${esc(c)}</b><div class="muted small">${esc(x.desc)}</div></div>${action}</div>`;
 }).join('');
 const achHtml=achievementDefs.map(a=>{
   const unlocked=state.achievements.includes(a.id);
   return `<div class="loot ${unlocked?'':'locked'}"><b>${unlocked?'🏆':'🔒'} ${esc(a.name)}</b><div class="muted small">${esc(a.desc)}</div><div class="small">Reward: ${a.reward} gold</div></div>`;
 }).join('');
 const cosmeticHtml=state.cosmetics.length?state.cosmetics.map(id=>{
   const c=cosmetics.find(x=>x.id===id); if(!c)return '';
   return `<div class="item"><div><b>${esc(c.name)}</b><div class="muted small">${esc(c.desc)}</div></div><button onclick="useCosmetic('${c.id}')">${state.equippedCosmetics?.[c.type.toLowerCase()]===c.id?'Equipped':'Equip'}</button></div>`;
 }).join(''):`<div class="empty">Buy cosmetics in the Shop.</div>`;
 const logHtml=state.log.slice(0,8).map(x=>`<div class="muted small">• ${esc(x)}</div>`).join('');
 document.getElementById('app').innerHTML=`<div class="grid"><section class="panel wide"><h2>🧙 Character</h2>${spriteHtml()}<div class="muted small">Visual layers are separated by slot, so equipped items never hide one another.</div></section><section class="panel"><h2>⚙️ Character Setup</h2><label>Name</label><input id="charName" value="${esc(state.name)}"><button style="margin-top:10px" onclick="state.name=document.getElementById('charName').value||'Adventurer';save();render()">Save name</button><h3>Class</h3>${classHtml}</section><section class="panel"><h2>🏆 Achievements</h2>${achHtml}</section><section class="panel wide"><h2>✨ Cosmetics</h2><div class="muted small">Cosmetics have no gameplay effect.</div>${cosmeticHtml}</section><section class="panel wide"><h2>Recent activity</h2>${logHtml||'<div class="empty">No activity yet.</div>'}<h2 style="margin-top:20px">⚠️ Data</h2><p class="muted">Your save lives only in this browser. Export regularly for backups or moving devices.</p><button class="danger" onclick="resetData()">Reset character</button></section></div>`;
}

try{const _d=state.dungeon;if(_d&&Number(_d.enemyHp)===105){_d.enemyHp=enemyMax(_d);_d.damageThisEnemy=0}_d.version=DUNGEON_STATE_VERSION;save()}catch(e){}
render();
